<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Attempts · Test UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="page" id="app">
<div class="header"><h1>Attempts</h1></div><div id="list"></div>
</main>
<script type="module">
import { api, mountNav, esc, fmtDate, badge, showError, attemptListStatus } from "/js/common.js";
const role = mountNav("attempts");
try {
  const attempts = await api("/attempts");
  document.querySelector("#list").innerHTML = attempts.length ? `<div class="card table-wrap"><table>
    <tr><th>Skill</th><th>Caregiver</th><th>AI result</th><th>Nurse</th><th>Score</th><th>Flags</th><th>When</th><th></th></tr>
    ${attempts.map((a) => `<tr>
      <td>${esc(a.skill_name)}</td><td>${esc(a.caregiver_name || "—")}</td>
      <td>${badge(attemptListStatus({ ...a, nurse_status: null }))}</td>
      <td>${a.nurse_status ? badge(a.nurse_status) : a.needs_review ? `<span class="badge unverified">Needs review</span>` : "—"}</td>
      <td>${a.score_pct == null ? "—" : `${Math.round(a.score_pct)}<span class="muted small"> /100</span>`}</td><td>${a.flag_count}</td>
      <td class="muted small">${fmtDate(a.created_at)}</td>
      <td><a href="/${role === "nurse" ? "review" : "result"}.html?id=${a.id}">Open</a></td></tr>`).join("")}
    </table></div>` : `<div class="notice">No attempts yet.</div>`;
} catch (err) { showError("#list", err); }
</script>
</body>
</html>
