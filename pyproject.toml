[project]
name = "firstshift"
version = "0.1.0"
description = "FirstShift: video-based caregiver skill training and verification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "google-genai>=2.3.0",
    "psycopg[binary,pool]>=3.2",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "mediapipe>=0.10.18",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
