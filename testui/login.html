<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Log in · Test UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth { max-width: 26rem; margin: 3rem auto; }
  .auth form { display: grid; gap: 0.25rem; }
  #signup-only[hidden] { display: none; }
</style>
</head>
<body>
<main class="page">
<div class="auth">
  <div class="header"><div>
    <h1 id="title">Log in</h1>
    <p class="muted">The built-in test UI uses the same accounts as the web app.</p>
  </div></div>
  <div class="card">
    <form id="form" novalidate>
      <div id="signup-only" hidden>
        <label for="role">I am a</label>
        <select id="role"><option value="nurse">Nurse</option><option value="caregiver">Caregiver</option></select>
        <label for="name">Full name</label>
        <input type="text" id="name" autocomplete="name" maxlength="120">
      </div>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <div id="error"></div>
      <button class="btn primary" id="submit" type="submit" style="margin-top:0.75rem">Log in</button>
    </form>
  </div>
  <p class="small muted"><a href="#" id="toggle">Need an account? Create one</a></p>
</div>
</main>
<script type="module">
import { api, qs, showError } from "/js/common.js";

const $ = (sel) => document.querySelector(sel);
let signup = false;

$("#toggle").addEventListener("click", (event) => {
  event.preventDefault();
  signup = !signup;
  $("#signup-only").hidden = !signup;
  $("#title").textContent = signup ? "Create account" : "Log in";
  $("#submit").textContent = signup ? "Create account" : "Log in";
  $("#toggle").textContent = signup ? "Already have an account? Log in" : "Need an account? Create one";
  $("#password").autocomplete = signup ? "new-password" : "current-password";
  $("#error").innerHTML = "";
});

$("#form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("#error").innerHTML = "";
  const body = { email: $("#email").value.trim(), password: $("#password").value };
  if (signup) Object.assign(body, { role: $("#role").value, name: $("#name").value.trim() });
  $("#submit").disabled = true;
  try {
    const user = await api(signup ? "/auth/signup" : "/auth/login", { json: body });
    try { localStorage.setItem("testui.role", user.role); } catch { /* storage unavailable */ }
    // Only follow a path on this site, never a full URL handed in through ?next=.
    const next = qs("next");
    location.replace(next && next.startsWith("/") && !next.startsWith("//") ? next : "/index.html");
  } catch (err) {
    showError("#error", err);
    $("#submit").disabled = false;
  }
});
</script>
</body>
</html>
