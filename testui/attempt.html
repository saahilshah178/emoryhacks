<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Practice a skill · FirstShift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .setup { display: grid; gap: 0 1rem; grid-template-columns: 2fr 1fr; }
  @media (max-width: 640px) { .setup { grid-template-columns: 1fr; } }
  ol.steps { margin: 0.4rem 0 0; padding-left: 1.4rem; }
  ol.steps li { margin: 0.2rem 0; }
  details.reference { margin-top: 0.75rem; }
  details.reference summary { cursor: pointer; color: var(--accent); }
  details.reference video { margin-top: 0.6rem; }
  #progress[hidden], #retry[hidden], #practice[hidden] { display: none; }
</style>
</head>
<body>
<main class="page" id="app">
<div class="header">
  <div>
    <h1>Practice a skill</h1>
    <p class="muted">Record yourself performing the skill and get step-by-step feedback.</p>
  </div>
</div>

<div id="load-error"></div>
<div id="practice" hidden>
  <div class="card setup">
    <div>
      <label for="skill">Skill</label>
      <select id="skill"></select>
    </div>
    <div>
      <label for="caregiver">Your name</label>
      <input type="text" id="caregiver" maxlength="120" autocomplete="name" placeholder="First and last name">
    </div>
  </div>

  <div class="card" id="skill-info"></div>

  <div class="card"><div id="recorder"></div></div>

  <div class="card" id="progress" hidden></div>
  <div id="error"></div>
  <button class="btn" id="retry" hidden>Try the upload again</button>
</div>
</main>
<script type="module">
import { api, esc, fmtTime, mountNav, qs, showError, thumbUrl, videoUrl } from "/js/common.js";
import { createRecorder, uploadAndWait } from "/js/recorder.js";

mountNav("attempt");
const NAME_KEY = "firstshift.caregiverName";
const $ = (sel) => document.querySelector(sel);
const select = $("#skill");
const nameInput = $("#caregiver");

try { nameInput.value = localStorage.getItem(NAME_KEY) || ""; } catch { /* storage unavailable */ }
nameInput.addEventListener("input", () => {
  try { localStorage.setItem(NAME_KEY, nameInput.value.trim()); } catch { /* storage unavailable */ }
});

// Show the chosen skill's steps and its reference so the caregiver knows what to perform.
async function showSkill(id) {
  const info = $("#skill-info");
  const url = new URL(location.href);
  url.searchParams.set("skill_id", id);
  history.replaceState(null, "", url);
  info.innerHTML = `<p class="muted">Loading steps…</p>`;
  try {
    const skill = await api(`/skills/${id}`);
    info.innerHTML = `
      <h2>${esc(skill.name)}</h2>
      ${skill.summary ? `<p class="muted">${esc(skill.summary)}</p>` : ""}
      <p class="label">Steps to perform${skill.order_matters ? ", in this order" : ""}</p>
      <ol class="steps">${skill.steps.map((s) => `<li>${esc(s.title)}${s.critical ? ` <span class="badge critical">critical</span>` : ""}</li>`).join("")}</ol>
      ${skill.reference_video_id ? `
        <details class="reference">
          <summary>Watch the reference video (${fmtTime(skill.video?.duration_s)})</summary>
          <video src="${videoUrl(skill.reference_video_id)}" poster="${thumbUrl(skill.reference_video_id, (skill.video?.duration_s || 2) / 2)}" controls preload="metadata" playsinline></video>
        </details>` : ""}
      <p class="small"><a href="/skill.html?id=${esc(skill.id)}">Open the full skill page</a></p>`;
  } catch (err) {
    showError(info, err);
  }
}

async function submit(file) {
  $("#error").innerHTML = "";
  $("#retry").hidden = true;
  const caregiver = nameInput.value.trim();
  if (!caregiver) {
    nameInput.focus();
    return showError("#error", "Enter your name first, then press “Use this video” again.");
  }
  const form = new FormData();
  form.append("file", file, file.name);
  form.append("kind", "attempt");
  form.append("skill_id", select.value);
  form.append("caregiver_name", caregiver);
  try {
    const { attempt_id } = await uploadAndWait(form, $("#progress"), {
      linkFor: (body) => ({ href: `/result.html?id=${body.attempt_id}`, text: "Your attempt is saved. Open its result page" }),
    });
    location.href = `/result.html?id=${attempt_id}`;
  } catch (err) {
    showError("#error", err);
    $("#retry").hidden = !err.retryable;
  }
}

try {
  const skills = await api("/skills");
  if (!skills.length) {
    $("#load-error").innerHTML = `<div class="notice">No skills yet. A nurse needs to record a reference video first.</div>`;
  } else {
    select.innerHTML = skills.map((s) =>
      `<option value="${esc(s.id)}">${esc(s.name)}${s.version > 1 ? ` (v${s.version})` : ""} · ${s.step_count} steps</option>`).join("");
    const listed = (skillId) => skillId && skills.some((s) => String(s.id) === String(skillId));
    let wanted = qs("skill_id");
    if (wanted && !listed(wanted)) {
      // An older version of a skill: practise its newest version instead.
      wanted = await api(`/skills/${encodeURIComponent(wanted)}`).then((s) => s.latest_id, () => null);
    }
    if (listed(wanted)) select.value = wanted;
    select.addEventListener("change", () => showSkill(select.value));
    $("#practice").hidden = false;
    showSkill(select.value);
    const recorder = createRecorder($("#recorder"), { onVideo: submit });
    $("#retry").addEventListener("click", () => recorder.use());
  }
} catch (err) {
  showError("#load-error", err);
}
</script>
</body>
</html>
