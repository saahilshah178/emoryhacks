<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Skills · Test UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="page" id="app">
<div class="header"><div><h1>Skills</h1><p class="muted" id="sub"></p></div><div id="actions"></div></div>
<div id="skills"></div>
<p class="label">Recent attempts</p>
<div id="attempts"></div>
<p class="muted small" id="status" style="margin-top:2rem"></p>
</main>
<script type="module">
import { api, mountNav, esc, fmtTime, fmtDate, badge, thumbUrl, showError, attemptListStatus, humanize } from "/js/common.js";
const role = mountNav("home");
document.querySelector("#sub").textContent = role === "nurse"
  ? "Record a reference video and the AI turns it into a step-by-step rubric."
  : "Pick a skill, record yourself, and get step-by-step feedback.";
document.querySelector("#actions").innerHTML = role === "nurse"
  ? `<a class="btn primary" href="/record.html">Record reference</a>`
  : `<a class="btn primary" href="/attempt.html">Practice a skill</a>`;
try {
  const skills = await api("/skills");
  document.querySelector("#skills").innerHTML = skills.length ? skills.map((s) => `
    <a class="card clickable row" href="/skill.html?id=${s.id}" style="text-decoration:none;color:inherit">
      ${s.reference_video_id ? `<img class="thumb" src="${thumbUrl(s.reference_video_id, (s.duration_s || 0) / 2)}" alt="">` : ""}
      <div class="grow">
        <h3>${esc(s.name)}</h3>
        <p class="muted small">Version ${s.version} · ${s.step_count} steps · ${fmtTime(s.duration_s)} · ${esc(humanize(s.category))}</p>
        <p class="muted">${esc(s.summary)}</p>
      </div>
    </a>`).join("") : `<div class="notice">No skills yet. A nurse records a reference video to create one.</div>`;
  const attempts = await api("/attempts");
  document.querySelector("#attempts").innerHTML = attempts.length ? `<div class="card table-wrap"><table>
    <tr><th>Skill</th><th>Caregiver</th><th>Result</th><th>When</th><th></th></tr>
    ${attempts.slice(0, 10).map((a) => `<tr>
      <td>${esc(a.skill_name)}</td><td>${esc(a.caregiver_name || "—")}</td>
      <td>${badge(attemptListStatus(a))}</td>
      <td class="muted small">${fmtDate(a.created_at)}</td>
      <td><a href="/${role === "nurse" ? "review" : "result"}.html?id=${a.id}">Open</a></td></tr>`).join("")}
    </table></div>` : `<div class="notice">No attempts yet.</div>`;
} catch (err) { showError("#skills", err); }
// Where the data lives and how much Gemini spend is recorded, so a tester sees the cap coming.
try {
  const h = await api("/health");
  const db = h.database.tiger_cloud ? `Tiger Cloud (TimescaleDB ${h.database.timescaledb})` : `local TimescaleDB ${h.database.timescaledb}`;
  const ai = h.gemini.fake_ai ? "canned AI (no Gemini calls)"
    : `Gemini ${h.gemini.model_main} · $${h.gemini.spent_usd.toFixed(2)} of the $${h.gemini.budget_usd.toFixed(2)} spend cap used`;
  document.querySelector("#status").textContent = `Database: ${db} · ${ai}`;
} catch { /* the status line is optional */ }
</script>
</body>
</html>
