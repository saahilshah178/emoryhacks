<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill · FirstShift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .back { display: inline-block; margin-bottom: 0.75rem; text-decoration: none; }
  .head-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .summary { max-width: 46rem; margin-top: 0.6rem; }
  .player { margin-bottom: 0.9rem; }
  .two-col { display: grid; gap: 0.9rem; grid-template-columns: 1fr 1fr; align-items: start; }
  .two-col .card { margin-bottom: 0; }
  .people li { margin-bottom: 0.3rem; }
  .step { transition: border-color 0.15s, background 0.15s; }
  .step.active { background: #fff8f1; box-shadow: 0 0 0 1px var(--accent); }
  .step .thumb { cursor: pointer; }
  .step h3 { margin-bottom: 0.15rem; }
  .step-meta { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
  .chip { font: inherit; font-size: 0.85rem; font-variant-numeric: tabular-nums; color: var(--accent); background: #f6e6dd;
          border: 0; border-radius: 999px; padding: 0.15rem 0.7rem; cursor: pointer; }
  .chip:hover { background: var(--accent); color: #fff; }
  details.criteria { margin-top: 0.6rem; }
  details.criteria summary { cursor: pointer; color: var(--muted); font-size: 0.875rem; }
  .criteria-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(3, 1fr); margin-top: 0.5rem; }
  .criteria-grid h4 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .criteria-grid .pass h4 { color: var(--pass); }
  .criteria-grid .fail h4 { color: var(--fail); }
  .criteria-grid .unv h4 { color: var(--unv); }
  .criteria-grid ul { font-size: 0.9rem; }
  .edit-grid { display: grid; gap: 0 0.9rem; grid-template-columns: 1fr 1fr; }
  .edit-grid .full { grid-column: 1 / -1; }
  .inline { display: flex; gap: 0.5rem; align-items: center; color: var(--ink); font-size: 0.95rem; }
  .inline input { width: auto; }
  .times { display: flex; gap: 0.5rem; }
  .edit-bar { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
  @media (max-width: 760px) { .two-col, .criteria-grid, .edit-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="page" id="app">
  <a class="back" href="/index.html">← Back</a>
  <div id="head"><p class="muted">Loading…</p></div>
  <div id="job"></div>
  <div id="player" class="player"></div>
  <div id="context" class="two-col"></div>
  <p class="label" id="steps-label"></p>
  <div id="steps"></div>
  <div id="edit-bar"></div>
</main>
<script type="module" src="/js/skill.js"></script>
</body>
</html>
