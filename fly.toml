# The API on Fly.io, built from the Dockerfile. Deploy with: fly deploy --ha=false
#
# It runs as exactly one machine that is never stopped. Videos are kept on that machine's
# disk and grading runs in its own threads, so a second copy would not see the first one's
# files, and stopping it between requests would cut a grading job short.
#
# Secrets are not in this file: fly secrets set GEMINI_API_KEY=... DATABASE_URL=...
app = "emoryhacks-api"
# Ashburn, Virginia: next to the Tiger Cloud database and Vercel's default region.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Video uploads go from the browser straight to this address, with a short-lived ticket,
# because the web app's host (Vercel) refuses forwarded request bodies above about 20 MB.
# WEB_ORIGINS is the web app that may do so. See backend/app/routers/videos.py.
[env]
  FIRSTSHIFT_PUBLIC_API_URL = "https://emoryhacks-api.fly.dev"
  FIRSTSHIFT_WEB_ORIGINS = "https://emoryhacks.vercel.app"

# Uploaded videos, thumbnails and the pose model (FIRSTSHIFT_DATA_DIR in the Dockerfile).
[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # "/" answers without touching the database; /api/health counts rows on every call.
  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
