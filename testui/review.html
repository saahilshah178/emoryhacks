<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Review attempt · Test UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .review-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
  .player { position: sticky; top: 0.75rem; }
  .videos { display: grid; gap: 0.6rem; grid-template-columns: 1fr; }
  .videos.compare { grid-template-columns: 1fr 1fr; }
  .videos figure { margin: 0; }
  .videos figcaption { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

  .bar { position: relative; margin-top: 0.8rem; user-select: none; }
  .bar .lanes { position: relative; background: #f1ebe0; border-radius: 8px; cursor: pointer; }
  .bar .seg { position: absolute; height: 22px; border-radius: 5px; border: 0; padding: 0; color: #fff; font: 600 0.72rem var(--sans);
              overflow: hidden; white-space: nowrap; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08); }
  .bar .seg.passed { background: var(--pass); }
  .bar .seg.failed { background: var(--fail); }
  .bar .seg.unverified { background: #c58f1c; }
  .bar .seg.pending { background: #b3a897; }
  .bar .seg.selected { outline: 2px solid var(--ink); outline-offset: 1px; }
  .bar .seg.by-grader { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0 4px, transparent 4px 8px); }
  .bar .markers { position: relative; height: 20px; margin-top: 3px; }
  .bar .marker { position: absolute; top: 0; transform: translateX(-50%); border: 0; background: none; padding: 0; cursor: pointer;
                 font-size: 0.85rem; line-height: 1; }
  .bar .marker.flag { color: var(--fail); }
  .bar .marker.flag.low, .bar .marker.flag.medium { color: #c58f1c; }
  .bar .marker.order { color: var(--accent); }
  .bar .cursor { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); pointer-events: none; }
  .axis { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .legend { display: flex; gap: 0.9rem; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 0.3rem; vertical-align: -1px; }
  .controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 0.8rem; }
  .controls .hint { margin-left: auto; }
  kbd { font: 0.75rem var(--sans); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 0.3rem; background: var(--card); }
  #next-label { min-height: 1.4em; }

  .step { scroll-margin-top: 0.75rem; }
  .step.playing { border-color: var(--accent); box-shadow: 0 0 0 2px #f3d9cc; }
  .step.focused { border-color: var(--ink); box-shadow: 0 0 0 2px #e6dccb; }
  .step .top { display: flex; gap: 0.5rem; align-items: baseline; justify-content: space-between; }
  .step h3 { font-size: 1.05rem; }
  .step .meta { display: flex; gap: 0.5rem 0.9rem; flex-wrap: wrap; align-items: center; font-size: 0.85rem; color: var(--muted); margin: 0.35rem 0; }
  .badge.order { color: #fff; background: var(--accent); }
  .badge.checked { color: var(--ink); background: #ece4f6; }
  .seg-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg-toggle button { border: 0; background: var(--card); padding: 0.25rem 0.75rem; font: inherit; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
  .seg-toggle button + button { border-left: 1px solid var(--line); }
  .seg-toggle button.on[data-status="passed"] { background: var(--pass); color: #fff; }
  .seg-toggle button.on[data-status="failed"] { background: var(--fail); color: #fff; }
  .seg-toggle button.on[data-status="unverified"] { background: #c58f1c; color: #fff; }
  .nurse { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed var(--line); }
  .nurse input { flex: 1; min-width: 10rem; padding: 0.3rem 0.6rem; font-size: 0.875rem; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0.9rem; }
  .summary .card { margin: 0; }
  .issue { display: flex; gap: 0.6rem; align-items: baseline; padding: 0.35rem 0; border-top: 1px solid var(--line); font-size: 0.9rem; }
  .issue:first-of-type { border-top: 0; }
  .issue .grow { flex: 1; min-width: 0; }
  .result-line { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin: 0.3rem 0 0.4rem; }
  .score { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; }

  @media (max-width: 860px) {
    .review-grid { grid-template-columns: 1fr; }
    .player { position: static; }
    .videos.compare { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="page wide" id="app">
  <div class="header">
    <div>
      <h1 id="title">Review attempt</h1>
      <p class="muted" id="subtitle"></p>
    </div>
    <div id="final"></div>
  </div>
  <div id="job"></div>
  <div class="summary" id="summary"></div>

  <div class="review-grid" style="margin-top: 1.25rem">
    <section class="player" aria-label="Attempt video">
      <div class="videos" id="videos">
        <figure>
          <video id="video" controls preload="metadata" playsinline></video>
          <figcaption id="video-caption">Attempt</figcaption>
        </figure>
        <figure id="ref-figure" hidden>
          <video id="ref-video" controls preload="metadata" playsinline muted></video>
          <figcaption id="ref-caption">Reference</figcaption>
        </figure>
      </div>
      <div class="bar" id="bar">
        <div class="lanes" id="lanes"></div>
        <div class="markers" id="markers"></div>
        <div class="cursor" id="cursor"></div>
      </div>
      <div class="axis" id="axis"></div>
      <div class="legend">
        <span><i style="background: var(--pass)"></i>Passed</span>
        <span><i style="background: var(--fail)"></i>Failed</span>
        <span><i style="background: #c58f1c"></i>Unverified</span>
        <span><i style="background: #b3a897"></i>Not graded yet</span>
        <span><i style="background: repeating-linear-gradient(135deg, #b3a897 0 3px, #ddd3c4 3px 6px)"></i>Placed by the grader, not the timeline</span>
        <span><span style="color: var(--fail)">▲</span> Safety flag</span>
        <span><span style="color: var(--accent)">◆</span> Out of order</span>
      </div>
      <div class="controls">
        <button class="btn primary small" id="next-btn">Next item to review</button>
        <label class="small" style="margin: 0"><input type="checkbox" id="compare"> Compare with reference</label>
        <span class="hint muted small"><kbd>space</kbd> play · <kbd>j</kbd>/<kbd>k</kbd> previous / next step</span>
      </div>
      <p class="muted small" id="next-label"></p>
    </section>

    <section aria-label="Steps">
      <p class="label" style="margin-top: 0">Steps in rubric order</p>
      <div id="steps"></div>
      <div class="card" id="decision"></div>
    </section>
  </div>
</main>
<script type="module" src="/js/review.js"></script>
</body>
</html>
